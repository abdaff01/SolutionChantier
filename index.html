<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solutions Chantier</title>
<meta name="description" content="">
<meta name="theme-color" content="#15233f">
<link rel="icon" href="images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="new-home.css">
<script src="content.js?v=2" defer></script>
<script src="catalogue-core.js" defer></script>
<script src="products.js" defer></script>
</head>
<body>

<header class="hdr">
  <div class="hdr-glass" aria-hidden="true"></div>
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Solutions Chantier">
      <img class="logo" data-img="logo" src="images/logo.jpg" alt="Solutions Chantier" width="44" height="44">
      <span><b>Solutions Chantier</b><small data-i18n="brand_sub"></small></span>
    </a>
    <nav class="nav" id="nav">
      <a href="#problems" data-i18n="nav_problems"></a>
      <a href="#products" data-i18n="nav_products"></a>
      <a href="#brands" data-i18n="nav_brands"></a>
      <a href="#help" data-i18n="nav_help"></a>
      <a href="#visit" data-i18n="nav_visit"></a>
      <a href="https://solutionchantier.com/contact" target="_blank" rel="noopener" data-i18n="nav_contact"></a>
    </nav>
    <div class="hdr-actions">
      <div class="langs" role="group" aria-label="Language">
        <button class="lang" data-lang="ar" title="العربية" aria-label="العربية">
          <svg viewBox="0 0 30 20" aria-hidden="true"><rect width="15" height="20" fill="#006233"/><rect x="15" width="15" height="20" fill="#fff"/><circle cx="15" cy="10" r="5" fill="#d21034"/><circle cx="16.4" cy="10" r="4.1" fill="#fff"/><polygon fill="#d21034" points="17.2,7.7 17.76,9.23 19.39,9.29 18.1,10.29 18.55,11.86 17.2,10.95 15.85,11.86 16.3,10.29 15.01,9.29 16.64,9.23"/></svg>
        </button>
        <button class="lang" data-lang="fr" title="Français" aria-label="Français">
          <svg viewBox="0 0 30 20" aria-hidden="true"><rect width="10" height="20" fill="#0055a4"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ef4135"/></svg>
        </button>
        <button class="lang" data-lang="en" title="English" aria-label="English">
          <svg viewBox="0 0 60 40" aria-hidden="true"><rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0L60 40M60 0L0 40" stroke="#c8102e" stroke-width="3"/><path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="13"/><path d="M30 0V40M0 20H60" stroke="#c8102e" stroke-width="8"/></svg>
        </button>
      </div>
      <a class="btn btn-wa btn-sm hdr-wa" data-wa="generic" href="#" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i><span data-i18n="cta_wa"></span></a>
      <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><i class="fas fa-bars"></i></button>
    </div>
  </div>
</header>

<main id="top">

<section class="hero">
  <div class="hero-photo"><div class="hero-img" data-img-bg="storefront"></div></div>
  <div class="hero-scrim"></div>
  <div class="wrap hero-body">
    <h1><span data-i18n="hero_t1"></span> <span data-i18n="hero_t2"></span></h1>
    <p class="lede" data-i18n="hero_sub"></p>
    <div class="hero-cta">
      <a class="btn btn-gold" data-wa="generic" href="#" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i><span data-i18n="hero_cta1"></span></a>
      <a class="btn-line" href="#visit"><span data-i18n="hero_cta2"></span></a>
    </div>
    <div class="hero-meta">
      <span><b data-field="address"></b></span>
      <span><b data-i18n="c_hours"></b></span>
    </div>
  </div>
</section>

<div class="ticker" aria-hidden="true">
  <div class="tk-inner">
    <div class="tk">
      <span data-i18n="tk1"></span><span data-i18n="tk2"></span><span data-i18n="tk3"></span><span data-i18n="tk4"></span><span data-i18n="tk5"></span><span data-i18n="tk6"></span>
      <span data-i18n="tk1"></span><span data-i18n="tk2"></span><span data-i18n="tk3"></span><span data-i18n="tk4"></span><span data-i18n="tk5"></span><span data-i18n="tk6"></span>
    </div>
  </div>
</div>

<section id="problems" class="pad on-white">
  <div class="wrap problems-grid">
    <div class="head">
      <h2 class="title" data-i18n="pr_title"></h2>
      <p class="lede" data-i18n="pr_sub"></p>
      <a class="btn btn-wa" data-wa="generic" href="#" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i><span data-i18n="cta_wa"></span></a>
    </div>
    <div class="plist">
      <div>
        <h3 data-i18n="pr1_t"></h3>
        <p data-i18n="pr1_d"></p>
        <button class="go" data-filter="all"><span data-i18n="pr_link"></span></button>
      </div>
      <div>
        <h3 data-i18n="pr2_t"></h3>
        <p data-i18n="pr2_d"></p>
        <button class="go" data-filter="moisture"><span data-i18n="pr_link"></span></button>
      </div>
      <div>
        <h3 data-i18n="pr3_t"></h3>
        <p data-i18n="pr3_d"></p>
        <button class="go" data-filter="concrete"><span data-i18n="pr_link"></span></button>
      </div>
    </div>
  </div>
</section>

<section id="products" class="pad on-paper">
  <div class="wrap">
    <div class="p-top">
      <div class="head">
        <h2 class="title" data-i18n="p_title"></h2>
        <p class="lede" data-i18n="p_sub"></p>
      </div>
      <div class="cat-bar">
        <div class="chips" id="chips" role="group" data-i18n-aria="p_title"><span class="chip-ind" aria-hidden="true"></span></div>
        <p class="count" id="pcount"></p>
      </div>
    </div>
    <div class="grid" id="pgrid"></div>
  </div>
</section>

<div class="haz" aria-hidden="true"></div>

<section id="brands" class="pad on-white">
  <div class="wrap">
    <div class="head" style="margin-bottom:44px">
      <h2 class="title" data-i18n="b_title"></h2>
    </div>
    <div class="indep">
      <p data-i18n="b_note"></p>
      <div class="bchips" id="bchips"></div>
    </div>
    <div class="grid4" id="bgrid"></div>
  </div>
</section>

<section id="help" class="pad on-dark">
  <div class="wrap help-grid">
    <div>
      <h2 class="title" data-i18n="h_title"></h2>
      <p class="lede" data-i18n="h_text"></p>
      <ol class="steps">
        <li data-i18n="h_s1"></li><li data-i18n="h_s2"></li><li data-i18n="h_s3"></li>
      </ol>
      <p class="help-call"><small data-i18n="v_phone_l"></small><a class="ltr" data-tel data-field-tel href="#"></a></p>
    </div>
    <form class="form" id="form">
      <div class="fg"><label for="fn" data-i18n="h_name"></label><input id="fn" type="text" autocomplete="name" required></div>
      <div class="fg"><label for="ft" data-i18n="h_type"></label>
        <select id="ft" required>
          <option value="" data-i18n="h_sel"></option>
          <option value="1" data-i18n="h_o1"></option><option value="2" data-i18n="h_o2"></option><option value="3" data-i18n="h_o3"></option><option value="4" data-i18n="h_o4"></option><option value="5" data-i18n="h_o5"></option>
        </select></div>
      <div class="fg"><label for="fd" data-i18n="h_msg"></label><textarea id="fd" data-i18n-ph="h_ph" required></textarea></div>
      <button class="btn btn-wa" type="submit"><i class="fab fa-whatsapp"></i><span data-i18n="h_send"></span></button>
      <p class="fnote" data-i18n="h_note"></p>
    </form>
  </div>
</section>

<section class="pad on-paper">
  <div class="wrap">
    <div class="head" style="margin-bottom:44px">
      <h2 class="title" data-i18n="w_title"></h2>
    </div>
    <div class="why">
      <div><h3 data-i18n="w1_t"></h3><p data-i18n="w1_d"></p></div>
      <div><h3 data-i18n="w2_t"></h3><p data-i18n="w2_d"></p></div>
      <div><h3 data-i18n="w3_t"></h3><p data-i18n="w3_d"></p></div>
      <div><h3 data-i18n="w4_t"></h3><p data-i18n="w4_d"></p></div>
    </div>
  </div>
</section>

<section id="visit" class="pad on-white">
  <div class="wrap">
    <div class="head" style="margin-bottom:44px">
      <h2 class="title" data-i18n="v_title"></h2>
    </div>
    <div class="visit">
      <div class="info">
        <div class="irow"><small data-i18n="v_addr_l"></small><b data-field="address"></b></div>
        <div class="irow"><small data-i18n="v_phone_l"></small><b><a class="ltr" data-tel href="#" data-field-tel></a></b></div>
        <div class="irow"><small data-i18n="c_hours_l"></small><b data-i18n="c_hours"></b></div>
        <div class="cta-row">
          <a class="btn btn-wa" data-wa="generic" href="#" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i><span data-i18n="cta_wa"></span></a>
          <a class="btn btn-gold" data-tel href="#"><i class="fas fa-phone"></i><span data-i18n="v_call"></span></a>
          <a class="btn btn-gold" id="dir" href="#" target="_blank" rel="noopener"><i class="fas fa-diamond-turn-right"></i><span data-i18n="v_dir"></span></a>
        </div>
        <div class="social">
          <a class="btn btn-sm" style="background:var(--navy);color:#fff" data-fb href="#" target="_blank" rel="noopener"><i class="fab fa-facebook-f"></i>Facebook</a>
          <a class="btn btn-sm" style="background:var(--navy);color:#fff" data-tt href="#" target="_blank" rel="noopener"><i class="fab fa-tiktok"></i>TikTok</a>
        </div>
      </div>
      <div class="map">
        <iframe id="mapf" title="Solutions Chantier" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </div>
    </div>
  </div>
</section>
<div class="haz" aria-hidden="true"></div>
</main>

<footer>
  <div class="wrap">
    <div class="ft">
      <div class="ft-brand">
        <b>Solutions Chantier</b>
        <p class="n" data-i18n="ft_note"></p>
      </div>
      <div class="ft-soc">
        <a data-fb href="#" target="_blank" rel="noopener" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a data-tt href="#" target="_blank" rel="noopener" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        <a data-wa="generic" href="#" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        <a href="contact.html" aria-label="Contact"><i class="fas fa-address-card"></i></a>
      </div>
    </div>
    <p class="copy" data-i18n="ft_rights"></p>
  </div>
</footer>

<div class="dock">
  <button class="t" id="toTop" data-i18n-aria="ft_top"><i class="fas fa-chevron-up"></i></button>
  <a class="w" data-wa="generic" href="#" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
</div>

<div class="mascot" id="mascot" aria-hidden="true"><div class="mascot-sprite" id="mascotSprite"></div></div>

<dialog class="lb" id="lb" aria-labelledby="lbT">
  <div class="lb-box">
    <button class="lb-x" id="lbX" type="button" data-i18n-aria="lb_close"><i class="fas fa-xmark"></i></button>
    <div class="lb-img"><img id="lbImg" alt=""><i class="fas fa-image lb-ph" id="lbPh" hidden></i></div>
    <div class="lb-info">
      <span class="brandtag" id="lbB"></span>
      <h3 id="lbT"></h3>
      <p class="kind" id="lbK"></p>
      <p class="desc" id="lbD"></p>
      <ul id="lbU"></ul>
      <p class="note" id="lbN"></p>
      <a class="btn btn-wa" id="lbW" href="#" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i><span data-i18n="p_btn"></span></a>
      <div class="lb-foot">
        <button class="lb-nav" id="lbPrev" type="button" data-i18n-aria="lb_prev"><i class="fas fa-chevron-left"></i></button>
        <span id="lbC" class="ltr"></span>
        <button class="lb-nav" id="lbNext" type="button" data-i18n-aria="lb_next"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
  </div>
</dialog>

<noscript><p style="padding:20px;text-align:center">JavaScript is required to display this site.</p></noscript>

<script src="new-home.js" defer></script>
<script src="vendor/quick-liquid.js" defer></script>
<script src="glass.js" defer></script>
</body>
</html>
