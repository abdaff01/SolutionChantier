<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solution Chantier</title>
<meta name="description" content="">
<meta name="theme-color" content="#15233f">
<link rel="icon" href="images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="content.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#15233f;--navy-2:#0c1630;--gold:#eab617;--gold-d:#c89a0a;
  --paper:#f6f3ea;--white:#fff;--ink:#0f1a33;--muted:#596379;--line:#e4dfcf;
  --wa:#25d366;--r:16px;--shadow:0 12px 32px rgba(12,22,48,.12);--ease:cubic-bezier(.2,.7,.2,1);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html[lang=ar]{--fh:'Cairo',sans-serif;--fb:'Cairo',sans-serif}
html:not([lang=ar]){--fh:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'Barlow',system-ui,sans-serif}
body{font-family:var(--fb);color:var(--ink);background:var(--paper);line-height:1.7;overflow-x:hidden;transition:opacity .22s}
body.swap{opacity:0}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--fh);line-height:1.15}
html:not([lang=ar]) h1,html:not([lang=ar]) h2,html:not([lang=ar]) .up{text-transform:uppercase;letter-spacing:.02em}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:22px}
section{scroll-margin-top:76px}
.pad{padding-block:96px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:1rem;border:2px solid transparent;transition:transform .25s var(--ease),box-shadow .25s,background .25s,color .25s}
.btn:hover{transform:translateY(-3px)}
.btn-gold{background:var(--gold);color:var(--navy-2);box-shadow:0 8px 22px rgba(234,182,23,.35)}
.btn-gold:hover{background:#f5c52b;box-shadow:0 12px 28px rgba(234,182,23,.5)}
.btn-line{border-color:rgba(255,255,255,.55);color:#fff}
.btn-line:hover{background:#fff;color:var(--navy)}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{background:#1ebe5d;box-shadow:0 10px 24px rgba(37,211,102,.4)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-2)}
.btn-sm{padding:10px 18px;font-size:.9rem}
.arr{transition:transform .25s}
[dir=rtl] .arr{transform:scaleX(-1)}
a:hover .arr{transform:translateX(4px)}
[dir=rtl] a:hover .arr{transform:scaleX(-1) translateX(4px)}

.hdr{position:sticky;top:0;z-index:60;background:rgba(12,22,48,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(234,182,23,.28)}
.hdr .wrap{display:flex;align-items:center;gap:22px;height:74px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;flex-shrink:0}
.logo{width:50px;height:50px;border-radius:50%;object-fit:cover;transition:transform .5s var(--ease)}
.brand:hover .logo{transform:rotate(-8deg) scale(1.06)}
.brand b{display:block;font-family:var(--fh);font-size:1.35rem;font-weight:800;line-height:1.05;white-space:nowrap}
html:not([lang=ar]) .brand b{text-transform:uppercase;letter-spacing:.04em}
.brand small{display:block;color:var(--gold);font-size:.74rem;font-weight:500;white-space:nowrap}
.nav{display:flex;gap:26px;margin-inline-start:auto}
.nav a{color:rgba(255,255,255,.82);font-weight:600;font-size:.95rem;position:relative;padding:6px 0;transition:color .2s}
.nav a::after{content:"";position:absolute;inset-inline:0;bottom:0;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .3s var(--ease)}
.nav a:hover,.nav a.on{color:var(--gold)}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.hdr-actions{display:flex;align-items:center;gap:14px}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:999px}
.lang{width:38px;height:30px;border-radius:999px;border:2px solid transparent;background:transparent;display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s}
.lang:hover{transform:scale(1.1)}
.lang[aria-pressed=true]{border-color:var(--gold);background:rgba(234,182,23,.18)}
.lang svg{width:24px;height:16px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:1.15rem}

.hero{position:relative;background:var(--navy);color:#fff;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 65% 45%,#000 15%,transparent 72%);mask-image:radial-gradient(ellipse at 65% 45%,#000 15%,transparent 72%)}
.hero::after{content:"";position:absolute;z-index:-1;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(234,182,23,.22),transparent 68%);inset-inline-end:-120px;top:-140px}
.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:60px;align-items:center;padding-block:78px 96px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--gold);font-weight:700;font-size:.85rem}
html:not([lang=ar]) .eyebrow{text-transform:uppercase;letter-spacing:.14em}
.eyebrow::before{content:"";width:34px;height:3px;background:var(--gold);border-radius:2px}
.hero h1{font-size:clamp(2.7rem,6.2vw,5.2rem);font-weight:800;margin:18px 0 20px}
html[lang=ar] .hero h1{line-height:1.3;font-weight:900;font-size:clamp(2.4rem,5.4vw,4.4rem)}
.hero h1 .hl{color:var(--gold);display:block}
.hero p.lead{font-size:1.14rem;color:rgba(255,255,255,.82);max-width:560px;margin-bottom:34px}
.hero-btns{display:flex;flex-wrap:wrap;gap:14px}
.e{opacity:0;transform:translateY(22px);animation:up .85s var(--ease) forwards;animation-delay:calc(var(--i,0)*.13s + .1s)}
@keyframes up{to{opacity:1;transform:none}}
.frame{position:relative;animation:up 1s var(--ease) .25s both;margin-block:18px 30px;margin-inline-end:18px}
.frame::before{content:"";position:absolute;inset:18px -18px -18px 18px;border:3px solid var(--gold);border-radius:22px;z-index:-1;transition:inset .5s var(--ease)}
[dir=rtl] .frame::before{inset:18px 18px -18px -18px}
.frame:hover::before{inset:10px -10px -10px 10px}
[dir=rtl] .frame:hover::before{inset:10px 10px -10px -10px}
.frame>img.shop{width:100%;aspect-ratio:1264/694;object-fit:cover;border-radius:22px;box-shadow:0 30px 60px rgba(0,0,0,.4);background:var(--navy-2)}
.seal{position:absolute;inset-inline-start:-26px;bottom:-30px;width:118px;height:118px;border-radius:50%;object-fit:cover;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45));animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.tag{position:absolute;inset-inline-end:16px;bottom:16px;background:var(--gold);color:var(--navy-2);font-weight:800;font-size:.82rem;padding:8px 14px;border-radius:999px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--gold) 0 16px,var(--navy-2) 16px 32px);background-size:45.25px 45.25px;animation:slide 2.4s linear infinite}
@keyframes slide{to{background-position:45.25px 0}}

.ticker{background:var(--gold);color:var(--navy-2);overflow:hidden;direction:ltr}
.tk{display:flex;width:max-content;animation:tk 38s linear infinite}
.ticker:hover .tk{animation-play-state:paused}
.tk span{padding:14px 26px;font-family:var(--fh);font-weight:800;font-size:1.05rem;white-space:nowrap;display:flex;align-items:center;gap:52px}
html:not([lang=ar]) .tk span{text-transform:uppercase;letter-spacing:.08em}
.tk span::after{content:"";width:10px;height:10px;background:var(--navy-2);transform:rotate(45deg)}
@keyframes tk{to{transform:translateX(-50%)}}

.head{max-width:680px;margin-bottom:52px}
.head h2{font-size:clamp(2rem,4.2vw,3.2rem);font-weight:800;margin:12px 0 14px;color:var(--navy)}
html[lang=ar] .head h2{line-height:1.35;font-weight:900}
.head p{color:var(--muted);font-size:1.08rem}
.dark .head h2{color:#fff}.dark .head p{color:rgba(255,255,255,.75)}

.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.prob{position:relative;display:flex;flex-direction:column;background:#fff;border-radius:var(--r);padding:36px 30px 30px;box-shadow:var(--shadow);overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s}
.prob::before{content:"";position:absolute;top:0;inset-inline:0;height:5px;background:var(--gold);transform:scaleX(.18);transform-origin:left;transition:transform .45s var(--ease)}
[dir=rtl] .prob::before{transform-origin:right}
.prob:hover{transform:translateY(-8px);box-shadow:0 22px 44px rgba(12,22,48,.2)}
.prob:hover::before{transform:scaleX(1)}
.num{position:absolute;top:14px;inset-inline-end:22px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:4.2rem;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(234,182,23,.55)}
.ico{width:64px;height:64px;border-radius:18px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:1.6rem;margin-bottom:22px;transition:transform .4s var(--ease)}
.prob:hover .ico{transform:rotate(-8deg) scale(1.08)}
.prob h3{font-size:1.65rem;font-weight:800;color:var(--navy);margin-bottom:10px}
html[lang=ar] .prob h3{font-size:1.4rem;line-height:1.4}
.prob p{color:var(--muted);flex:1;margin-bottom:22px}
.link{color:var(--navy);font-weight:700;display:inline-flex;gap:8px;align-items:center;border-bottom:2px solid var(--gold);align-self:flex-start;padding-bottom:2px;cursor:pointer;background:none;border-top:0;border-inline:0;font-size:inherit}

.band{background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.chip{border:2px solid var(--line);background:#fff;color:var(--navy);font-weight:700;padding:9px 20px;border-radius:999px;transition:all .2s;font-size:.95rem}
.chip:hover{border-color:var(--navy)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.card{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .35s var(--ease),box-shadow .35s}
.band .card{border:1px solid var(--line);box-shadow:none}
.card:hover{transform:translateY(-8px);box-shadow:0 24px 46px rgba(12,22,48,.2)}
.card.hide{display:none}
.pic{position:relative;overflow:hidden;background:var(--navy);aspect-ratio:4/4.6}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.card:hover .pic img{transform:scale(1.07)}
.pic.fit{background:#fff;aspect-ratio:1/1}
.pic.fit img{object-fit:contain;padding:12px}
.new{position:absolute;top:14px;inset-inline-start:14px;background:var(--gold);color:var(--navy-2);font-weight:800;font-size:.75rem;padding:5px 12px;border-radius:999px;z-index:1}
.body{padding:22px 22px 24px;display:flex;flex-direction:column;flex:1}
.brandtag{font-size:.78rem;font-weight:700;color:var(--gold-d);margin-bottom:4px}
html:not([lang=ar]) .brandtag{text-transform:uppercase;letter-spacing:.12em}
.body h3{font-size:1.7rem;font-weight:800;color:var(--navy);line-height:1.1}
html[lang=ar] .body h3{font-size:1.4rem}
.kind{font-weight:600;color:var(--navy);margin:6px 0 4px;font-size:.98rem}
.desc{color:var(--muted);font-size:.95rem;flex:1;margin-bottom:18px}
.body .btn{width:100%}

.indep{display:flex;gap:22px;align-items:flex-start;background:var(--navy);color:#fff;border-radius:var(--r);padding:30px;margin-bottom:40px;border-inline-start:8px solid var(--gold)}
.indep>i{font-size:2rem;color:var(--gold);margin-top:4px}
.indep p{font-size:1.2rem;font-weight:600;line-height:1.6}
.bchips{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.bchips span{border:1px solid rgba(255,255,255,.28);padding:6px 16px;border-radius:999px;font-weight:700;font-size:.9rem;color:rgba(255,255,255,.92)}

.help{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.help::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(234,182,23,.14),transparent 45%)}
.help .wrap{position:relative}
.help-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:56px;align-items:start}
.steps{list-style:none;display:grid;gap:16px;margin-top:30px;counter-reset:s}
.steps li{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.07);border-radius:14px;padding:16px 20px;font-weight:600;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--navy-2);display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.4rem}
.form{background:#fff;color:var(--ink);border-radius:20px;padding:34px;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.fg{display:grid;gap:6px;margin-bottom:18px}
.fg label{font-weight:700;font-size:.9rem;color:var(--navy)}
.fg input,.fg select,.fg textarea{font:inherit;width:100%;padding:13px 15px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);transition:border-color .2s,background .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--navy);background:#fff}
.fg textarea{min-height:110px;resize:vertical}
.form .btn{width:100%}
.fnote{margin-top:12px;font-size:.85rem;color:var(--muted);text-align:center}

.why{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.why>div{padding:28px 24px;border-radius:var(--r);background:#fff;border:1px solid var(--line);transition:transform .3s var(--ease),border-color .3s}
.why>div:hover{transform:translateY(-6px);border-color:var(--gold)}
.why i{font-size:1.7rem;color:var(--gold-d);margin-bottom:16px;display:block}
.why h3{font-size:1.4rem;font-weight:800;color:var(--navy);margin-bottom:8px}
html[lang=ar] .why h3{font-size:1.2rem}
.why p{color:var(--muted);font-size:.96rem}

.visit{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:stretch}
.info{display:grid;gap:16px;align-content:start}
.irow{display:flex;gap:18px;align-items:center;background:#fff;border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);border-inline-start:6px solid var(--gold)}
.irow>i{flex:none;width:50px;height:50px;border-radius:14px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:1.2rem}
.irow small{display:block;color:var(--muted);font-weight:600;font-size:.82rem}
.irow b{font-size:1.08rem;color:var(--navy);line-height:1.5}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.social{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
.map{border-radius:20px;overflow:hidden;box-shadow:var(--shadow);min-height:420px;background:var(--line)}
.map iframe{width:100%;height:100%;min-height:420px;border:0}

footer{background:var(--navy-2);color:rgba(255,255,255,.72);padding:54px 0 26px}
.ft{display:flex;gap:34px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-bottom:30px;border-bottom:1px solid rgba(255,255,255,.12)}
.ft p.n{max-width:560px;font-size:.92rem}
.ft-soc{display:flex;gap:10px}
.ft-soc a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#fff;transition:background .2s,color .2s,transform .2s}
.ft-soc a:hover{background:var(--gold);color:var(--navy-2);transform:translateY(-3px)}
.copy{padding-top:22px;font-size:.85rem}

.dock{position:fixed;inset-inline-end:20px;bottom:22px;z-index:70;display:grid;gap:12px;justify-items:center}
.dock a,.dock button{width:56px;height:56px;border-radius:50%;border:0;display:grid;place-items:center;font-size:1.6rem;color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.3);transition:transform .25s}
.dock a:hover,.dock button:hover{transform:scale(1.1)}
.dock .w{background:var(--wa);animation:pulse 2.6s infinite}
.dock .t{background:var(--navy);color:var(--gold);width:44px;height:44px;font-size:1rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.dock .t.show{opacity:1;pointer-events:auto}
@keyframes pulse{0%{box-shadow:0 8px 22px rgba(0,0,0,.3),0 0 0 0 rgba(37,211,102,.55)}70%{box-shadow:0 8px 22px rgba(0,0,0,.3),0 0 0 16px rgba(37,211,102,0)}100%{box-shadow:0 8px 22px rgba(0,0,0,.3),0 0 0 0 rgba(37,211,102,0)}}

.js .rv{opacity:0;transform:translateY(28px);transition:opacity .75s var(--ease) var(--d,0s),transform .75s var(--ease) var(--d,0s)}
.js .rv.in{opacity:1;transform:none}

@media (max-width:1020px){
  .hero-grid,.help-grid,.visit{grid-template-columns:minmax(0,1fr)}
  .hero-grid{padding-block:56px 80px;gap:56px}
  .probs,.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid4,.why{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav{display:none;position:absolute;top:74px;inset-inline:0;background:var(--navy-2);flex-direction:column;gap:0;padding:8px 22px 18px;border-bottom:3px solid var(--gold)}
  .nav.open{display:flex}
  .nav a{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .burger{display:block}
  .hdr-actions{margin-inline-start:auto}
  .hdr-wa{display:none}
}
@media (max-width:640px){
  .pad{padding-block:68px}
  .probs,.grid,.grid4,.why{grid-template-columns:minmax(0,1fr)}
  .hdr .wrap{gap:10px;padding-inline:14px}
  .brand span{display:none}
  .logo{width:42px;height:42px}
  .hdr-actions{gap:8px}
  .lang{width:32px}
  .frame{margin-inline-end:10px}
  .seal{width:92px;height:92px;inset-inline-start:-10px;bottom:-24px}
  .hero-btns .btn{width:100%}
  .indep{flex-direction:column;padding:24px}
  .form{padding:24px 20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .e,.frame,.js .rv{opacity:1;transform:none}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Solution Chantier">
      <img class="logo" data-img="logo" src="images/logo.jpg" alt="Solution Chantier" width="50" height="50">
      <span><b>Solution Chantier</b><small data-i18n="brand_sub"></small></span>
    </a>
    <nav class="nav" id="nav">
      <a href="#problems" data-i18n="nav_problems"></a>
      <a href="#products" data-i18n="nav_products"></a>
      <a href="#brands" data-i18n="nav_brands"></a>
      <a href="#help" data-i18n="nav_help"></a>
      <a href="#visit" data-i18n="nav_visit"></a>
    </nav>
    <div class="hdr-actions">
      <div class="langs" role="group" aria-label="Language">
        <button class="lang" data-lang="ar" title="العربية" aria-label="العربية">
          <svg viewBox="0 0 30 20" aria-hidden="true"><rect width="15" height="20" fill="#006233"/><rect x="15" width="15" height="20" fill="#fff"/><circle cx="15" cy="10" r="5" fill="#d21034"/><circle cx="16.4" cy="10" r="4.1" fill="#fff"/><polygon fill="#d21034" points="17.2,7.7 17.76,9.23 19.39,9.29 18.1,10.29 18.55,11.86 17.2,10.95 15.85,11.86 16.3,10.29 15.01,9.29 16.64,9.23"/></svg>
        </button>
        <button class="lang" data-lang="fr" title="Français" aria-label="Français">
          <svg viewBox="0 0 30 20" aria-hidden="true"><rect width="10" height="20" fill="#0055a4"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ef4135"/></svg>
        </button>
        <button class="lang" data-lang="en" title="English" aria-label="English">

<noscript><p style="padding:20px;text-align:center">JavaScript is required to display this site.</p></noscript>

<script>
const C=(()=>{
  try{ if(/[?&]preview=1/.test(location.search)){ const d=localStorage.getItem('sc_draft'); if(d) return JSON.parse(d); } }catch(e){}
  return window.SC_CONTENT;
})();
const LANGS=['ar','fr','en'];
let L=(()=>{ try{ const s=localStorage.getItem('sc_lang'); return LANGS.includes(s)?s:'ar'; }catch(e){ return 'ar'; } })();
let FILTER='all';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=k=>C.texts[k][L];
const fill=(t,v)=>t.replace(/\{(\w+)\}/g,(_,k)=>v[k]??'');
const wa=t=>`https://wa.me/${C.contact.whatsapp}?text=${encodeURIComponent(t)}`;
const el=(tag,cls,text)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; };
const ic=c=>{ const i=document.createElement('i'); i.className=c; return i; };

function renderProducts(){
  const grid=$('#pgrid'); grid.replaceChildren();
  C.products.forEach((p,i)=>{
    const card=el('article',`card rv${FILTER==='all'||p.cats.includes(FILTER)?'':' hide'}`);
    card.style.setProperty('--d',(i%3*.08)+'s');
    const pic=el('div','pic');
    if(p.isNew) pic.append(el('span','new',T('p_new')));
    const img=el('img'); img.src=p.image; img.alt=p.name; img.loading='lazy'; img.decoding='async';
    pic.append(img);
    const body=el('div','body');
    body.append(el('span','brandtag',p.brand), el('h3',null,p.name), el('p','kind',p.kind[L]), el('p','desc',p.desc[L]));
    const a=el('a','btn btn-wa btn-sm'); a.href=wa(fill(C.texts.msg_ask[L],{name:p.name})); a.target='_blank'; a.rel='noopener';
    a.append(ic('fab fa-whatsapp'), el('span',null,T('p_btn')));
    body.append(a); card.append(pic,body); grid.append(card);
  });
}

function renderBrands(){
  const grid=$('#bgrid'); grid.replaceChildren();
  C.brands.forEach((b,i)=>{
    const card=el('article','card rv'); card.style.setProperty('--d',(i*.08)+'s');
    const pic=el('div',b.fit?'pic fit':'pic');
    const img=el('img'); img.src=b.image; img.alt=b.name; img.loading='lazy'; img.decoding='async';
    pic.append(img);
    const body=el('div','body');
    body.append(el('span','brandtag',b.brand), el('h3',null,b.name), el('p','desc',b.kind[L]));
    const a=el('a','btn btn-navy btn-sm'); a.href=wa(fill(C.texts.msg_ask[L],{name:`${b.brand} — ${b.name}`})); a.target='_blank'; a.rel='noopener';
    a.append(ic('fab fa-whatsapp'), el('span',null,T('b_btn')));
    body.append(a); card.append(pic,body); grid.append(card);
  });
}

function renderChips(){
  const box=$('#bchips'); box.replaceChildren();
  C.brandChips.forEach(n=>box.append(el('span',null,n)));
  box.append(el('span',null,T('b_more')));
}

function setFilter(f){
  FILTER=f;
  $$('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.f===f));
  renderProducts(); observe();
}

function apply(){
  const h=document.documentElement; h.lang=L; h.dir=L==='ar'?'rtl':'ltr';
  document.title=T('meta_title');
  $('meta[name=description]').content=T('meta_desc');
  $$('[data-i18n]').forEach(e=>e.textContent=T(e.dataset.i18n));
  $$('[data-i18n-ph]').forEach(e=>e.placeholder=T(e.dataset.i18nPh));
  $$('[data-i18n-alt]').forEach(e=>e.alt=T(e.dataset.i18nAlt));
  $$('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',T(e.dataset.i18nAria)));
  $$('.lang').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L));
  $$('[data-wa=generic]').forEach(a=>a.href=wa(T('msg_generic')));
  $$('[data-field=address]').forEach(e=>e.textContent=C.contact.address[L]);
  $$('[data-tel]').forEach(a=>{ a.href='tel:'+C.contact.tel; });
  $$('[data-field-tel]').forEach(a=>{ a.href='tel:'+C.contact.tel; a.textContent=C.contact.phone; });
  $$('[data-fb]').forEach(a=>a.href=C.contact.facebook);
  $$('[data-tt]').forEach(a=>a.href=C.contact.tiktok);
  $$('[data-img=logo]').forEach(i=>i.src=C.images.logo);
  $$('[data-img=storefront]').forEach(i=>i.src=C.images.storefront);
  const q=encodeURIComponent(C.contact.mapQuery[L]);
  $('#dir').href=`https://www.google.com/maps/search/?api=1&query=${q}`;
  const f=$('#mapf'), src=`https://www.google.com/maps?q=${q}&hl=${L}&output=embed`;
  if(f.getAttribute('src')!==src) f.src=src;
  $$('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.f===FILTER));
  renderChips(); renderProducts(); renderBrands(); observe();
  try{ localStorage.setItem('sc_lang',L); }catch(e){}
}

function setLang(code){
  if(!LANGS.includes(code)||code===L) return;
  document.body.classList.add('swap');
  setTimeout(()=>{ L=code; apply(); document.body.classList.remove('swap'); },200);
}
$$('.lang').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

const nav=$('#nav'), burger=$('#burger');
burger.addEventListener('click',()=>{ const o=nav.classList.toggle('open'); burger.setAttribute('aria-expanded',o); });
$$('#nav a').forEach(a=>a.addEventListener('click',()=>{ nav.classList.remove('open'); burger.setAttribute('aria-expanded',false); }));

$$('.chip').forEach(c=>c.addEventListener('click',()=>setFilter(c.dataset.f)));
$$('[data-filter]').forEach(a=>a.addEventListener('click',()=>{ setFilter(a.dataset.filter); $('#products').scrollIntoView({behavior:'smooth'}); }));

$('#form').addEventListener('submit',e=>{
  e.preventDefault();
  const t=$('#ft'), type=t.value?t.options[t.selectedIndex].textContent:'-';
  window.open(wa(fill(C.texts.msg_form[L],{name:$('#fn').value.trim(),type,desc:$('#fd').value.trim()})),'_blank','noopener');
});

const io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
function observe(){ $$('.rv:not(.in)').forEach(e=>io.observe(e)); }
apply();

const toTop=$('#toTop');
const secs=['problems','products','brands','help','visit'].map(id=>document.getElementById(id));
addEventListener('scroll',()=>{
  toTop.classList.toggle('show',scrollY>500);
  let cur=''; secs.forEach(s=>{ if(s.getBoundingClientRect().top<140) cur=s.id; });
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+cur));
},{passive:true});
toTop.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
</script>
