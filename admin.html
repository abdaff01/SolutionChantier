<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solution Chantier — Admin</title>
<script src="content.js"></script>
<style>
*{box-sizing:border-box}
:root{--navy:#15233f;--navy-2:#0c1630;--gold:#eab617;--line:#dfe3ec;--bg:#f3f5f9;--ink:#15233f;--muted:#5d6780;--ok:#1f8f4e;--warn:#b26a00}
body{margin:0;font-family:system-ui,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:230px 1fr;min-height:100vh}
button{font:inherit;cursor:pointer}
aside{background:var(--navy-2);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside h2{margin:0 8px 14px;font-size:1.05rem;color:var(--gold)}
aside .nv{background:none;border:0;color:rgba(255,255,255,.8);text-align:start;padding:10px 12px;border-radius:10px;font-weight:600}
aside .nv:hover{background:rgba(255,255,255,.08)}
aside .nv[aria-current=true]{background:var(--gold);color:var(--navy-2)}
aside .foot{margin-top:auto;font-size:.8rem;color:rgba(255,255,255,.6);padding:10px 12px;line-height:1.6}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:1.45rem;flex:1;min-width:200px}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--navy);color:#fff}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:var(--navy-2)}
.btn.danger{color:#b3261e}
.btn.sm{padding:6px 10px;font-size:.85rem}
#state{font-size:.85rem;color:var(--muted);min-width:180px}
#state.dirty{color:var(--warn);font-weight:600}
#state.saved{color:var(--ok);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card h3{margin:0 0 14px;font-size:1.05rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.f{display:grid;gap:6px;font-size:.88rem;font-weight:600;color:var(--ink)}
input[type=text],input[type=url],textarea{font:inherit;font-weight:400;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:transparent}
textarea{min-height:70px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.cats{display:flex;gap:14px;flex-wrap:wrap}
.imgpick{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--navy)}
.item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#fbfcfe}
.item-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.item-h b{flex:1;font-size:1rem}
.item-h .tag{font-size:.75rem;background:#eef1f7;color:var(--muted);padding:3px 9px;border-radius:999px}
.banner{background:#fff6dc;border:1px solid #f1d78a;color:#5c4300;padding:12px 16px;border-radius:12px;margin-bottom:16px;font-size:.92rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.steps{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--navy-2);display:grid;place-items:center;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.stat b{display:block;font-size:1.6rem}
.stat span{color:var(--muted);font-size:.85rem}
.hint{font-size:.8rem;color:var(--muted);font-weight:400}
.ltxt{display:grid;gap:4px;margin-bottom:12px}
.ltxt code{font-size:.75rem;color:var(--muted);font-weight:400}
p.note{font-size:.92rem;margin:0 0 8px}
@media (max-width:900px){body{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}aside .foot{display:none}.grid2,.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside>
  <h2>Solution Chantier</h2>
  <button class="nv" data-v="overview">Overview</button>
  <button class="nv" data-v="contact">Contact &amp; address</button>
  <button class="nv" data-v="images">Images</button>
  <button class="nv" data-v="texts">Website text</button>
  <button class="nv" data-v="products">Products</button>
  <button class="nv" data-v="brands">Brands on shelves</button>
  <div class="foot">Changes are kept as a draft in this browser until you download content.js.</div>
</aside>

<main>
  <div class="top">
    <h1 id="ttl"></h1>
    <div class="tabs" role="group" aria-label="Editing language">
      <button data-al="ar">عربي</button>
      <button data-al="fr">Français</button>
      <button data-al="en">English</button>
    </div>
    <span id="state"></span>
    <button class="btn" id="preview">Preview site</button>
    <button class="btn pri" id="dl">Download content.js</button>
  </div>
  <div id="banner"></div>
  <div id="view"></div>
</main>

<datalist id="imgs"></datalist>
<input type="file" id="imp" accept=".js,text/javascript" hidden>

<script>
const IMAGES=['logo.jpg','49359.jpg','49360.jpg','49361.jpg','49362.jpg','49363.jpg','49364.jpg','49365.jpg','49366.jpg','49367.jpg','49368.jpg','49369.jpg','49370.jpg','49371.jpg','49372.jpg','49373.jpg','49374.jpg','49375.jpg','49376.jpg','49377.jpg','49378.jpg','49379.jpg','49380.jpg','49381.jpg','49382.jpg','49383.jpg'].map(f=>'images/'+f);
const GROUPS=[
  ['Header & navigation',/^(nav_|brand_sub|cta_wa)/],
  ['Hero (top of the home page)',/^hero_/],
  ['Scrolling banner',/^tk\d/],
  ['Problems section',/^(pr_|pr\d)/],
  ['Products section',/^(p_|f_)/],
  ['Brands section',/^b_/],
  ['Advice form',/^h_/],
  ['Why us',/^w_|^w\d/],
  ['Visit us',/^v_/],
  ['Footer',/^ft_/],
  ['WhatsApp messages & SEO',/^(meta_|msg_)/]
];
const HINTS={msg_ask:'Use {name} where the product name goes.',msg_form:'Use {name}, {type} and {desc}. They are filled from the advice form.',msg_generic:'Opening message for general WhatsApp buttons.'};
const CATS=[['moisture','Moisture'],['concrete','Concrete'],['floors','Floors']];
const LANG_NAMES={ar:'Arabic',fr:'French',en:'English'};

const SRC=window.SC_CONTENT;
const clone=x=>JSON.parse(JSON.stringify(x));
const valid=d=>!!(d&&d.contact&&d.texts&&Array.isArray(d.products)&&Array.isArray(d.brands)&&Array.isArray(d.brandChips)&&d.images);
let W,AL='ar',VIEW='overview',saved=false,fromDraft=false;
try{ const d=localStorage.getItem('sc_draft'); if(d&&valid(JSON.parse(d))){ W=JSON.parse(d); fromDraft=true; } }catch(e){}
if(!W) W=clone(SRC);

const $=s=>document.querySelector(s);
function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const[k,v] of Object.entries(props||{})){
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='value') e.value=v;
    else if(k==='checked') e.checked=!!v;
    else if(k==='onclick') e.addEventListener('click',v);
    else e.setAttribute(k,v===true?'':v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return; e.append(c instanceof Node?c:document.createTextNode(String(c))); });
  return e;
}
function persist(){
  try{ localStorage.setItem('sc_draft',JSON.stringify(W)); }catch(e){}
  saved=false; setState();
}
function setState(){
  const s=$('#state');
  if(saved){ s.textContent='Downloaded. Replace content.js in the project and push.'; s.className='saved'; }
  else { s.textContent='Unsaved changes (kept as a draft in this browser)'; s.className='dirty'; }
}
const bind=(el,fn)=>{ el.addEventListener('input',()=>{ fn(el.type==='checkbox'?el.checked:el.value); persist(); }); return el; };
const F=(label,control,hint)=>h('label',{class:'f'},label,control,hint?h('small',{class:'hint'},hint):null);
const txt=(o,k,type='text')=>bind(h('input',{type,value:o[k]??''}),v=>o[k]=v);
const lt=(o,k,multi)=>{
  o[k]=o[k]||{ar:'',fr:'',en:''};
  const ctl=multi?h('textarea',{value:o[k][AL]||''}):h('input',{type:'text',value:o[k][AL]||''});
  return bind(ctl,v=>o[k][AL]=v);
};
const chk=(o,k,label)=>h('label',{class:'chk'},bind(h('input',{type:'checkbox',checked:!!o[k]}),v=>o[k]=v),label);
function imgPick(o,k){
  const img=h('img',{class:'thumb',src:o[k]||'',alt:''});
  const inp=bind(h('input',{type:'text',list:'imgs',value:o[k]||''}),v=>{ o[k]=v; img.src=v; });
  return h('div',{class:'imgpick'},img,inp);
}
function move(arr,i,d){ const j=i+d; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; persist(); render(); }
function slug(s){ return (s||'item').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString(36).slice(-4); }
const note=t=>h('p',{class:'note'},t);

function vOverview(){
  return h('div',null,
    h('div',{class:'stats'},
      h('div',{class:'stat'},h('b',null,W.products.length),h('span',null,'Products')),
      h('div',{class:'stat'},h('b',null,W.brands.length),h('span',null,'Brand cards on the shelves')),
      h('div',{class:'stat'},h('b',null,Object.keys(W.texts).length),h('span',null,'Text blocks (3 languages each)')),
      h('div',{class:'stat'},h('b',null,'3'),h('span',null,'Languages: Arabic, French, English'))
    ),
    h('div',{class:'card'},h('h3',null,'How to publish a change'),
      h('ol',{class:'steps'},
        h('li',null,'Edit anything in the other sections. Each change is saved as a draft in this browser.'),
        h('li',null,'Click "Preview site" to see the real website with your draft (it opens in a new tab).'),
        h('li',null,'When you are happy, click "Download content.js".'),
        h('li',null,'Replace content.js in the project folder with the downloaded file, then commit and push. The website updates after the push.')
      )
    ),
    h('div',{class:'card'},h('h3',null,'Tips'),
      note('New photos: put the file in the images/ folder, then type its path (for example images/50001.jpg) in the photo field. The thumbnail shows the result.'),
      note('Fill all three languages for each text. The website shows only the language the visitor chooses, never two at once.'),
      note('To start over from the published content, click "Discard draft" in the top bar.')
    )
  );
}

function vContact(){
  const c=W.contact;
  c.address=c.address||{ar:'',fr:'',en:''};
  c.mapQuery=c.mapQuery||{ar:'',fr:'',en:''};
  return h('div',null,
    h('div',{class:'card'},h('h3',null,'Phone & WhatsApp'),
      h('div',{class:'grid2'},
        F('Phone (shown on the site)',txt(c,'phone')),
        F('Phone link (international, no spaces)',txt(c,'tel'),'Example: +213668834193'),
        F('WhatsApp number (digits only, no +)',txt(c,'whatsapp'),'Example: 213668834193')
      )),
    h('div',{class:'card'},h('h3',null,'Social links'),
      h('div',{class:'grid2'},
        F('Facebook page URL',txt(c,'facebook','url')),
        F('TikTok profile URL',txt(c,'tiktok','url'))
      )),
    h('div',{class:'card'},h('h3',null,`Address — ${LANG_NAMES[AL]}`),
      h('div',{class:'grid2'},
        F('Address shown on the site',lt(c,'address',true)),
        F('Map search text (used for the map and Directions)',lt(c,'mapQuery',false))
      )),
    h('div',{class:'card'},h('h3',null,'Brand names shown on the shelves'),
      F('Comma-separated list',bind(h('textarea',{value:W.brandChips.join(', ')}),v=>W.brandChips=v.split(',').map(s=>s.trim()).filter(Boolean)),'Example: Granitex, Sika, Pigma Color'))
  );
}

function vImages(){
  return h('div',null,
    h('div',{class:'card'},h('h3',null,'Logo (header, footer and the round seal on the hero)'),imgPick(W.images,'logo')),
    h('div',{class:'card'},h('h3',null,'Storefront photo (large picture on the hero)'),imgPick(W.images,'storefront'),
      note('Use a wide photo of the shop front. The site shows the whole picture without cropping.'))
  );
}

function vTexts(){
  const used=new Set();
  const root=h('div',null);
  const groups=GROUPS.map(([name,re])=>[name,Object.keys(W.texts).filter(k=>re.test(k)&&!used.has(k)).map(k=>(used.add(k),k))]);
  const other=Object.keys(W.texts).filter(k=>!used.has(k));
  if(other.length) groups.push(['Other',other]);
  groups.forEach(([name,keys])=>{
    if(!keys.length) return;
    const card=h('div',{class:'card'},h('h3',null,name));
    keys.forEach(k=>{
      const t=W.texts[k];
      t[AL]=t[AL]||'';
      const multi=(t.en||'').length>70||(t.ar||'').length>70;
      card.append(h('div',{class:'ltxt'},
        h('code',null,k),
        bind(multi?h('textarea',{value:t[AL]}):h('input',{type:'text',value:t[AL]}),v=>t[AL]=v),
        HINTS[k]?h('small',{class:'hint'},HINTS[k]):null
      ));
    });
    root.append(card);
  });
  return root;
}

function vProducts(){
  const root=h('div',null);
  W.products.forEach((p,i)=>{
    const cats=h('div',{class:'cats'},CATS.map(([v,l])=>{
      const cb=h('input',{type:'checkbox',checked:p.cats.includes(v)});
      cb.addEventListener('change',()=>{ p.cats=p.cats.filter(x=>x!==v); if(cb.checked) p.cats.push(v); persist(); });
      return h('label',{class:'chk'},cb,l);
    }));
    root.append(h('div',{class:'item'},
      h('div',{class:'item-h'},h('b',null,p.name||'(no name)'),h('span',{class:'tag'},p.brand||''),
        h('button',{class:'btn sm',onclick:()=>move(W.products,i,-1),title:'Move up'},'↑'),
        h('button',{class:'btn sm',onclick:()=>move(W.products,i,1),title:'Move down'},'↓'),
        h('button',{class:'btn sm danger',onclick:()=>{ if(confirm('Delete this product?')){ W.products.splice(i,1); persist(); render(); } }},'Delete')),
      h('div',{class:'grid2'},
        F('Product name',txt(p,'name')),
        F('Brand',txt(p,'brand')),
        F('Photo',imgPick(p,'image')),
        chk(p,'isNew','Show a "New" badge')
      ),
      h('div',{class:'f',style:'margin-top:12px'},'Shown under these filters',cats),
      h('div',{class:'grid2',style:'margin-top:12px'},
        F(`Short description — ${LANG_NAMES[AL]}`,lt(p,'kind',false)),
        F(`Details — ${LANG_NAMES[AL]}`,lt(p,'desc',true))
      )
    ));
  });
  root.append(h('button',{class:'btn pri',onclick:()=>{ W.products.push({id:slug('product'),name:'New product',brand:'Granitex',cats:['concrete'],image:IMAGES[0],isNew:false,kind:{ar:'',fr:'',en:''},desc:{ar:'',fr:'',en:''}}); persist(); render(); }},'+ Add product'));
  return root;
}

function vBrands(){
  const root=h('div',null);
  W.brands.forEach((b,i)=>{
    root.append(h('div',{class:'item'},
      h('div',{class:'item-h'},h('b',null,b.name||'(no name)'),h('span',{class:'tag'},b.brand||''),
        h('button',{class:'btn sm',onclick:()=>move(W.brands,i,-1),title:'Move up'},'↑'),
        h('button',{class:'btn sm',onclick:()=>move(W.brands,i,1),title:'Move down'},'↓'),
        h('button',{class:'btn sm danger',onclick:()=>{ if(confirm('Delete this brand card?')){ W.brands.splice(i,1); persist(); render(); } }},'Delete')),
      h('div',{class:'grid2'},
        F('Title on the card',txt(b,'name')),
        F('Brand',txt(b,'brand')),
        F('Photo',imgPick(b,'image')),
        chk(b,'fit','Show the whole photo (packaging on white)')
      ),
      h('div',{class:'grid2',style:'margin-top:12px'},F(`Short description — ${LANG_NAMES[AL]}`,lt(b,'kind',false)))
    ));
  });
  root.append(h('button',{class:'btn pri',onclick:()=>{ W.brands.push({id:slug('brand'),name:'New product',brand:'Brand',image:IMAGES[0],fit:true,kind:{ar:'',fr:'',en:''}}); persist(); render(); }},'+ Add brand card'));
  return root;
}

const VIEWS={overview:['Overview',vOverview],contact:['Contact & address',vContact],images:['Images',vImages],texts:['Website text',vTexts],products:['Products',vProducts],brands:['Brands on shelves',vBrands]};

function render(){
  const [title,fn]=VIEWS[VIEW];
  $('#ttl').textContent=title;
  document.querySelectorAll('.nv').forEach(b=>b.setAttribute('aria-current',b.dataset.v===VIEW));
  document.querySelectorAll('[data-al]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.al===AL));
  $('#view').replaceChildren(fn());
  $('#banner').replaceChildren(...(fromDraft?[h('div',{class:'banner'},'You have unsaved changes from a previous session. They are still stored in this browser.',h('button',{class:'btn sm',onclick:discard},'Discard them'))]:[]));
  setState();
}

function fileText(){
  return `/* Solution Chantier — site content. Edit with admin.html, then replace this file and push. */\nwindow.SC_CONTENT = ${JSON.stringify(W,null,2)};\n`;
}
function download(){
  const url=URL.createObjectURL(new Blob([fileText()],{type:'text/javascript;charset=utf-8'}));
  const a=h('a',{href:url,download:'content.js'});
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  saved=true; setState();
}
function discard(){
  if(!confirm('Discard all changes and go back to the published content?')) return;
  try{ localStorage.removeItem('sc_draft'); }catch(e){}
  W=clone(SRC); fromDraft=false; saved=false; render();
}
function importFile(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=new Function('window',r.result+'\nreturn window.SC_CONTENT;')({});
      if(!valid(d)) throw new Error('not a content file');
      W=clone(d); persist(); render(); alert('Imported. Review it, then download content.js.');
    }catch(e){ alert('This file is not a valid content.js file.'); }
  };
  r.readAsText(file,'utf-8');
}

document.querySelectorAll('.nv').forEach(b=>b.addEventListener('click',()=>{ VIEW=b.dataset.v; render(); }));
document.querySelectorAll('[data-al]').forEach(b=>b.addEventListener('click',()=>{ AL=b.dataset.al; render(); }));
$('#dl').addEventListener('click',download);
$('#preview').addEventListener('click',()=>{ persist(); window.open('index.html?preview=1','_blank','noopener'); });
$('#imp').addEventListener('change',e=>{ if(e.target.files[0]) importFile(e.target.files[0]); e.target.value=''; });

IMAGES.forEach(s=>$('#imgs').append(h('option',{value:s})));
const bar=document.querySelector('.top');
bar.append(h('button',{class:'btn',onclick:()=>navigator.clipboard&&navigator.clipboard.writeText(fileText()).then(()=>alert('Copied content.js to the clipboard.'))},'Copy'));
bar.append(h('button',{class:'btn',onclick:()=>$('#imp').click()},'Import'));
bar.append(h('button',{class:'btn danger',onclick:discard},'Discard draft'));
render();
</script>
</body>
</html>
