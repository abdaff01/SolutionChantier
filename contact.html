<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solutions Chantier</title>
<meta name="description" content="">
<meta name="theme-color" content="#15233f">
<link rel="icon" href="images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="content.js"></script>
<script src="vendor/qrcode.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#15233f;--navy-2:#0c1630;--gold:#eab617;--gold-d:#c89a0a;
  --paper:#f6f3ea;--white:#fff;--ink:#0f1a33;--muted:#596379;--line:#e4dfcf;
  --wa:#25d366;--c-fb:#1877f2;--tt:#000000;--mail:#c0392b;--ph:#15233f;
  --r:16px;--shadow:0 12px 32px rgba(12,22,48,.12);--ease:cubic-bezier(.2,.7,.2,1);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html[lang=ar]{--fh:'Cairo',sans-serif;--fb:'Cairo',sans-serif}
html:not([lang=ar]){--fh:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'Barlow',system-ui,sans-serif}
body{font-family:var(--fb);color:var(--ink);background:var(--paper);line-height:1.7;overflow-x:hidden;transition:opacity .22s}
body.swap{opacity:0}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
h1,h2{font-family:var(--fh);line-height:1.15}
html:not([lang=ar]) h1,html:not([lang=ar]) .up{text-transform:uppercase;letter-spacing:.02em}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1000px;margin:0 auto;padding-inline:22px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 24px;border-radius:999px;font-weight:700;font-size:.96rem;border:2px solid transparent;transition:transform .25s var(--ease),box-shadow .25s,background .25s,color .25s}
.btn:hover{transform:translateY(-3px)}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{background:#1ebe5d;box-shadow:0 10px 24px rgba(37,211,102,.4)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-2)}
.btn-line{border-color:var(--line);color:var(--navy)}
.btn-line:hover{border-color:var(--navy)}
.btn-sm{padding:9px 16px;font-size:.85rem}

.hdr{background:var(--navy-2);color:#fff}
.hdr .wrap{display:flex;align-items:center;gap:16px;padding-block:16px}
.brand{display:flex;align-items:center;gap:12px;color:#fff}
.logo{width:46px;height:46px;border-radius:50%;object-fit:cover}
.brand b{display:block;font-family:var(--fh);font-size:1.2rem;font-weight:800;line-height:1.05}
html:not([lang=ar]) .brand b{text-transform:uppercase;letter-spacing:.04em}
.brand small{display:block;color:var(--gold);font-size:.7rem;font-weight:500}
.hdr-actions{display:flex;align-items:center;gap:12px;margin-inline-start:auto}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:999px}
.lang{width:36px;height:28px;border-radius:999px;border:2px solid transparent;background:transparent;display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s}
.lang:hover{transform:scale(1.1)}
.lang[aria-pressed=true]{border-color:var(--gold);background:rgba(234,182,23,.18)}
.lang svg{width:22px;height:15px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.back{display:flex;color:rgba(255,255,255,.8);font-size:.9rem;font-weight:600;gap:8px;align-items:center}
.back i{transition:transform .2s}
[dir=rtl] .back i{transform:scaleX(-1)}
.back:hover{color:var(--gold)}

.hero{background:var(--navy);color:#fff;text-align:center;padding-block:54px 70px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 65%);mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 65%)}
.hero-inner{position:relative}
.hero .logo-big{width:104px;height:104px;border-radius:50%;object-fit:cover;margin:0 auto 20px;box-shadow:0 10px 30px rgba(0,0,0,.4);border:3px solid var(--gold)}
.hero h1{font-size:clamp(1.9rem,4.5vw,2.8rem);font-weight:800;margin-bottom:10px}
html[lang=ar] .hero h1{font-weight:900}
.hero p{color:rgba(255,255,255,.75);font-size:1.02rem;max-width:460px;margin:0 auto}

.content{padding-block:56px 80px}

/* Quick brand-icon row: one glance = all channels */
.chanRow{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:28px}
.chan{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:18px 10px;text-align:center;transition:transform .25s var(--ease),box-shadow .25s}
.chan:hover{transform:translateY(-5px);box-shadow:0 18px 36px rgba(12,22,48,.2)}
.chan .ic{width:52px;height:52px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;color:#fff;font-size:1.4rem}
.chan span{display:block;font-size:.78rem;font-weight:700;color:var(--navy)}
.ic.wa{background:var(--wa)}
.ic.ph{background:var(--ph)}
.ic.mail{background:var(--mail)}
.ic.fb{background:var(--c-fb)}
.ic.tt{background:var(--tt)}
.ic.pin{background:var(--gold-d)}
.ic.save{background:var(--navy)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.card{background:#fff;border-radius:var(--r);padding:26px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:flex-start}
.card.full{grid-column:1/-1}
.card .ic{flex:none;width:48px;height:48px;border-radius:14px;color:#fff;display:grid;place-items:center;font-size:1.15rem}
.card .body{flex:1;min-width:0}
.card small{display:block;color:var(--muted);font-weight:600;font-size:.8rem;margin-bottom:4px}
html:not([lang=ar]) .card small{text-transform:uppercase;letter-spacing:.08em}
.card .val{font-size:1.1rem;font-weight:700;color:var(--navy);word-break:break-word}
.card p.hint{color:var(--muted);font-size:.9rem;margin-top:6px;font-weight:400}
.card .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.map{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);min-height:320px;margin-bottom:24px}
.map iframe{width:100%;height:100%;min-height:320px;border:0}
.qr-card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:30px;text-align:center}
.qr-card p{color:var(--muted);font-size:.9rem}
#qrHint{font-weight:700;color:var(--navy);font-size:.95rem;margin-bottom:10px}

/* Tap-to-reveal QR: a canvas mosaic sampling the logo's own colours sits over the
   real QR grid; a tap ripples each tile from its logo colour to a QR module. */
.qr-reveal{display:inline-block;margin-bottom:14px;padding:9px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;line-height:0}
.qr-reveal:hover{border-color:var(--gold)}
#qrCanvas{display:block;border-radius:4px}

footer{background:var(--navy-2);color:rgba(255,255,255,.6);text-align:center;padding:26px 0;font-size:.85rem}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:720px){
  .cards{grid-template-columns:1fr}
  .chanRow{grid-template-columns:repeat(3,1fr);gap:10px}
  .brand small{display:none}
  .back span{display:none}
}
</style>
</head>
<body>

    <div class="hdr-actions">

          <svg viewBox="0 0 30 20" aria-hidden="true"><rect width="15" height="20" fill="#006233"/><rect x="15" width="15" height="20" fill="#fff"/><circle cx="15" cy="10" r="5" fill="#d21034"/><circle cx="16.4" cy="10" r="4.1" fill="#fff"/><polygon fill="#d21034" points="17.2,7.7 17.76,9.23 19.39,9.29 18.1,10.29 18.55,11.86 17.2,10.95 15.85,11.86 16.3,10.29 15.01,9.29 16.64,9.23"/></svg>

<section class="hero">
  <div class="wrap hero-inner">
    <img class="logo-big" data-img="logo" src="images/logo.jpg" alt="Solutions Chantier">

<section class="content">

    <!-- One-glance brand-icon row -->

      <p data-i18n="c_scan" style="margin-top:2px"></p>

</section>

<footer data-i18n="ft_rights"></footer>

<script>
const C=window.SC_CONTENT;
const LANGS=['ar','fr','en'];
let L=(()=>{ try{ const s=localStorage.getItem('sc_lang'); return LANGS.includes(s)?s:'ar'; }catch(e){ return 'ar'; } })();
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const T=k=>C.texts[k][L];
const wa=t=>`https://wa.me/${C.contact.whatsapp}?text=${encodeURIComponent(t)}`;
let vcardUrl=null;
function vcardText(){
  const addr=(C.contact.address[L]||'').replace(/[\r\n]+/g,' ');
  return [
    'BEGIN:VCARD','VERSION:3.0',
    'N:;Solutions Chantier;;;','FN:Solutions Chantier','ORG:Solutions Chantier',
    'TEL;TYPE=CELL,VOICE:'+C.contact.tel,
    'EMAIL;TYPE=INTERNET:'+C.contact.email,
    'ADR;TYPE=WORK:;;'+addr+';;;;',
    'URL:https://solutionchantier.com',
    'URL:'+C.contact.facebook,
    'END:VCARD'
  ].join('\r\n');
}
const isMobile=/iPad|iPhone|iPod|Android/i.test(navigator.userAgent)&&!window.MSStream;
function refreshVcard(){
  const a=$('#saveContact'); if(!a) return;
  if(vcardUrl) URL.revokeObjectURL(vcardUrl);
  vcardUrl=URL.createObjectURL(new Blob([vcardText()],{type:'text/vcard;charset=utf-8'}));
  a.href=vcardUrl;
  if(isMobile) a.removeAttribute('download');
  else a.setAttribute('download','Solutions-Chantier.vcf');
}

// Tap-to-reveal QR: a canvas mosaic that rests as a pixel-art version of the logo
// (sampling the logo's own colours per cell), then ripples from the centre outward,
// each cell fading and popping from its logo colour into a real QR module.
const QR_CELL=7, QR_URL='https://solutionchantier.com/contact';
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let qrDark=null, qrN=0, cells=[], dpr=Math.max(1,window.devicePixelRatio||1);
let revealed=false, animStart=0, animDir=1, raf=null;

function buildQrMatrix(){
  const qr=qrcode(0,'M');
  qr.addData(QR_URL);
  qr.make();
  qrN=qr.getModuleCount();
  qrDark=Array.from({length:qrN},(_,y)=>Array.from({length:qrN},(_,x)=>qr.isDark(y,x)));
  $('#qrFallbackImg').src=qr.createDataURL(6,2);
}
function sampleLogo(img){
  const off=document.createElement('canvas'); off.width=qrN; off.height=qrN;
  const octx=off.getContext('2d');
  octx.drawImage(img,0,0,qrN,qrN);
  const data=octx.getImageData(0,0,qrN,qrN).data;
  cells=[];
  const cx=(qrN-1)/2, cy=(qrN-1)/2, maxDist=Math.hypot(cx,cy);
  for(let y=0;y<qrN;y++) for(let x=0;x<qrN;x++){
    const i=(y*qrN+x)*4;
    const dark=qrDark[y][x];
    cells.push({
      x,y,
      from:[data[i],data[i+1],data[i+2]],
      to: dark? [15,26,51] : [255,255,255],
      delay: Math.hypot(x-cx,y-cy)/maxDist*520
    });
  }
}
function draw(progressFor){
  const canvas=$('#qrCanvas'); const ctx=canvas.getContext('2d');
  const size=qrN*QR_CELL;
  canvas.width=size*dpr; canvas.height=size*dpr; canvas.style.width=size+'px'; canvas.style.height=size+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size);
  for(const c of cells){
    const p=Math.max(0,Math.min(1,progressFor(c)));
    const r=c.from[0]+(c.to[0]-c.from[0])*p, g=c.from[1]+(c.to[1]-c.from[1])*p, b=c.from[2]+(c.to[2]-c.from[2])*p;
    const pop=1+0.22*Math.sin(Math.min(1,p*1.15)*Math.PI);
    const cell=QR_CELL*0.92*pop;
    const cx=c.x*QR_CELL+QR_CELL/2, cy=c.y*QR_CELL+QR_CELL/2;
    ctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(cx-cell/2,cy-cell/2,cell,cell,cell*0.22);
    else ctx.rect(cx-cell/2,cy-cell/2,cell,cell);
    ctx.fill();
  }
}
function animate(ts){
  if(!animStart) animStart=ts;
  const t=ts-animStart;
  const DUR=420;
  draw(c=>animDir>0 ? (t-c.delay)/DUR : 1-(t-c.delay)/DUR);
  const done=cells.every(c=>t-c.delay>=DUR);
  if(done){ draw(()=>animDir>0?1:0); raf=null; return; }
  raf=requestAnimationFrame(animate);
}
function startAnim(dir){
  animDir=dir; animStart=0;
  if(raf) cancelAnimationFrame(raf);
  if(reduceMotion){ draw(()=>dir>0?1:0); return; }
  raf=requestAnimationFrame(animate);
}
function toggleQr(){
  revealed=!revealed;
  $('#qrReveal').setAttribute('aria-pressed',revealed);
  $('#qrHint').textContent=T(revealed?'c_qr_hide':'c_qr_tap');
  startAnim(revealed?1:-1);
}
$('#qrReveal').addEventListener('click',toggleQr);
buildQrMatrix();
(() => {
  const img=new Image();
  img.onload=()=>{ sampleLogo(img); draw(()=>0); };
  img.src=C.images.logo;
})();

function apply(){
  const h=document.documentElement; h.lang=L; h.dir=L==='ar'?'rtl':'ltr';
  document.title=T('c_title')+' — Solutions Chantier';
  $('.back').setAttribute('aria-label',T('c_back'));
  $$('[data-i18n]').forEach(e=>e.textContent=T(e.dataset.i18n));
  $$('.lang').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L));
  $$('[data-wa=generic]').forEach(a=>a.href=wa(T('msg_generic')));
  $$('[data-field=address]').forEach(e=>e.textContent=C.contact.address[L]);
  $$('[data-tel]').forEach(a=>{ a.href='tel:'+C.contact.tel; if(!a.querySelector('span,i')) a.textContent=C.contact.phone; });
  $$('[data-email]').forEach(a=>{ a.href='mailto:'+C.contact.email; if(!a.querySelector('span,i')) a.innerHTML=C.contact.email.replace('@','@<wbr>'); });
  $$('[data-fb]').forEach(a=>a.href=C.contact.facebook);
  $$('[data-tt]').forEach(a=>a.href=C.contact.tiktok);
  $$('[data-img=logo]').forEach(i=>i.src=C.images.logo);
  const q=encodeURIComponent(C.contact.mapQuery[L]);
  $('#dir').href=C.contact.mapsLink||`https://www.google.com/maps/search/?api=1&query=${q}`;
  $('#mapf').src=`https://www.google.com/maps?q=${q}&hl=${L}&output=embed`;
  refreshVcard();
  $('#qrFallbackImg').alt=T('c_scan');
  $('#qrCanvas').setAttribute('aria-label',T('c_scan'));
  $('#qrHint').textContent=T($('#qrReveal').getAttribute('aria-pressed')==='true'?'c_qr_hide':'c_qr_tap');
  const pageUrl=location.href.split('#')[0];
  $('#shareFb').href=`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(pageUrl)}&quote=${encodeURIComponent(T('c_title'))}`;
  try{ localStorage.setItem('sc_lang',L); }catch(e){}
}
function toast(msg){
  let t=$('#toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.append(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),2200);
}
$('#shareMore').addEventListener('click', async e=>{
  e.preventDefault();
  const pageUrl=location.href.split('#')[0];
  if(navigator.share){
    try{ await navigator.share({ title:T('c_title'), url:pageUrl }); }catch(err){}
  } else {
    try{ await navigator.clipboard.writeText(pageUrl); toast(T('c_share_copied')); }
    catch(err){ prompt(T('c_share_more'), pageUrl); }
  }
});
function setLang(code){
  if(!LANGS.includes(code)||code===L) return;
  document.body.classList.add('swap');
  setTimeout(()=>{ L=code; apply(); document.body.classList.remove('swap'); },200);
}
$$('.lang').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
apply();
</script>
